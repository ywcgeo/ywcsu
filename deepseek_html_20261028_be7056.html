<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粵華中學 · 學生會出勤考察系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* 登入介面 */
        .login-wrapper { width: 100%; max-width: 440px; padding: 20px; }
        .login-card { background: white; border-radius: 36px; box-shadow: 0 25px 45px -12px rgba(11,43,68,0.25); overflow: hidden; }
        .login-header { background: linear-gradient(135deg, #0b2b44 0%, #1a4a6f 100%); padding: 32px; color: white; text-align: center; }
        .login-header .logo { font-size: 3.2rem; margin-bottom: 12px; line-height: 1; }
        .login-header h1 { font-size: 1.4rem; font-weight: 600; }
        .login-body { padding: 32px; }
        .form-group { margin-bottom: 20px; }
        .login-body label { display: block; font-size: 0.9rem; font-weight: 600; color: #1f4a66; margin-bottom: 7px; }
        .login-body input { width: 100%; padding: 14px 18px; border-radius: 20px; border: 1.5px solid #d9e4ee; font-size: 1rem; outline: none; background: #f8fbfe; }
        .login-btn { width: 100%; padding: 15px; border-radius: 40px; border: none; background: #0b2b44; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; transition: background 0.15s; }
        .login-btn:hover { background: #1a4a6f; }
        .login-error { color: #b3452c; font-size: 0.85rem; margin-top: 10px; text-align: center; min-height: 20px; }

        /* 主應用 */
        .app-container { max-width: 1280px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 20px 35px -8px rgba(0,20,30,0.15); overflow: hidden; display: none; flex-direction: column; margin: 24px; }
        .app-container.show { display: flex; }
        .header { background: linear-gradient(135deg, #0b2b44 0%, #1a4a6f 100%); color: white; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header h1 { font-size: 1.9rem; font-weight: 600; display: flex; align-items: center; gap: 16px; }
        .header .header-logo { font-size: 2.2rem; }
        .header h1 span { background: #f5b042; color: #0b2b44; font-size: 0.95rem; padding: 4px 14px; border-radius: 30px; font-weight: 700; }
        .header-right { display: flex; align-items: center; gap: 18px; }
        .user-badge { background: rgba(255,255,255,0.15); padding: 8px 20px; border-radius: 40px; font-size: 0.9rem; }
        .logout-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 8px 18px; border-radius: 40px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        
        /* 導航 */
        .nav-tabs { display: flex; background: #e9eef4; padding: 8px 8px 0 8px; gap: 4px; border-bottom: 1px solid #cddae5; }
        .nav-tab { padding: 14px 28px; font-weight: 600; font-size: 1rem; color: #2b4d64; background: transparent; border: none; border-radius: 16px 16px 0 0; cursor: pointer; opacity: 0.75; }
        .nav-tab.active { background: white; color: #0b2b44; opacity: 1; }
        .main-content { padding: 28px 32px; flex: 1; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        /* 表格與卡片 */
        .table-wrapper { overflow-x: auto; border-radius: 20px; border: 1px solid #d9e4ee; background: white; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; min-width: 800px; }
        th { background: #eef4fa; color: #1c3b50; font-weight: 600; padding: 16px 14px; text-align: left; }
        td { padding: 14px; border-bottom: 1px solid #e5edf4; }
        .attendance-cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; margin-top: 8px; }
        @media (max-width: 900px) { .attendance-cards-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 650px) { .attendance-cards-grid { grid-template-columns: repeat(2, 1fr); } }
        .attendance-card { background: #f8fbfe; border-radius: 24px; border: 1px solid #d9e4ee; padding: 20px 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; transition: all 0.15s; }
        .attendance-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px -8px rgba(11,43,68,0.18); }
        .attendance-card.selected-for-record { border: 3px solid #f5b042; background: #fffdf6; }
        .card-checkbox { position: absolute; top: 12px; left: 12px; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #cddae5; background: white; display: flex; align-items: center; justify-content: center; }
        .attendance-card.selected-for-record .card-checkbox { background: #f5b042; border-color: #f5b042; }
        .attendance-card.selected-for-record .card-checkbox::after { content: '✓'; color: white; font-size: 0.8rem; font-weight: 900; }
        .card-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.5rem; color: #1f4a66; background: #e2eaf1; margin-bottom: 10px; }
        .card-name { font-weight: 700; color: #0b2b44; font-size: 0.95rem; }
        .card-dept { font-size: 0.75rem; color: #7a93a6; margin-bottom: 8px; }
        
        /* 按鈕與過濾器 */
        .btn { display: inline-flex; padding: 10px 22px; border-radius: 40px; font-weight: 600; border: 1px solid #cddae5; background: white; color: #1f4a66; cursor: pointer; transition: all 0.15s; }
        .btn:hover { background: #eef4fa; }
        .btn-primary { background: #0b2b44; color: white; border-color: #0b2b44; }
        .btn-primary:hover { background: #1a4a6f; }
        .btn-sm { padding: 6px 16px; font-size: 0.82rem; }
        .btn-ghost { background: transparent; }
        .btn-danger { background: #b3452c; color: white; border-color: #b3452c; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .filter-bar { display: flex; gap: 14px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
        .filter-bar select, .filter-bar input { padding: 10px 18px; border-radius: 40px; border: 1px solid #cddae5; }
        
        /* 統計卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: #f8fbfe; padding: 20px 22px; border-radius: 24px; border: 1px solid #d9e4ee; }
        .stat-card .label { font-size: 0.9rem; font-weight: 500; color: #4a6579; margin-bottom: 8px; }
        .stat-card .value { font-size: 2.4rem; font-weight: 700; color: #0b2b44; }
        
        /* 模態框 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; max-width: 520px; width: 90%; border-radius: 32px; padding: 28px 30px; max-height: 90vh; overflow-y: auto; }
        .modal .form-row { margin-bottom: 18px; }
        .modal label { display: block; font-size: 0.9rem; font-weight: 600; color: #1f4a66; margin-bottom: 6px; }
        .modal input, .modal select { width: 100%; padding: 12px 16px; border-radius: 16px; border: 1px solid #cddae5; }
        .modal .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 26px; }
        
        /* 場次與登記面板 */
        .session-panel { background: #f0f7fe; border: 2px solid #4a7ab5; border-radius: 24px; padding: 22px 26px; margin-bottom: 24px; }
        .session-panel .session-body { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
        .session-panel .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 150px; }
        .session-panel .field label { font-size: 0.82rem; font-weight: 600; color: #1c4a7a; }
        .session-panel .field select, .session-panel .field input { padding: 10px 14px; border-radius: 14px; border: 1px solid #b6cfe6; }
        .record-panel { background: #fffbf2; border: 2px solid #f5b042; border-radius: 24px; padding: 22px 26px; margin-bottom: 24px; display: none; }
        .record-panel.show { display: block; }
        .record-panel-body { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
        .status-quick-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .status-quick-btn { padding: 8px 18px; border-radius: 30px; border: 1.5px solid #e0d5c0; background: white; font-weight: 600; cursor: pointer; transition: all 0.12s; }
        .status-quick-btn.selected { background: #f5b042; color: #0b2b44; border-color: #f5b042; }
        .status-quick-btn[data-status="準時"].selected { background: #1f8b4c; color: white; border-color: #1f8b4c; }
        .status-quick-btn[data-status="遲到"].selected { background: #e09e2e; color: white; border-color: #e09e2e; }
        .status-quick-btn[data-status="早退"].selected { background: #d36b4a; color: white; border-color: #d36b4a; }
        .status-quick-btn[data-status="請假"].selected { background: #4a7ab5; color: white; border-color: #4a7ab5; }
        .status-quick-btn[data-status="缺席"].selected { background: #b3452c; color: white; border-color: #b3452c; }
        
        /* 其他 */
        .toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #0b2b44; color: white; padding: 14px 28px; border-radius: 40px; opacity: 0; transition: opacity 0.25s; z-index: 2000; pointer-events: none; font-weight: 600; }
        .toast-message.show { opacity: 1; }
        .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.85); display:none; align-items:center; justify-content:center; z-index:9999; font-size:1.2rem; font-weight:bold; color:#0b2b44; }
        .loading-overlay.show { display:flex; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #e2eaf1; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #1f4a66; }
        .avatar-placeholder { background: #cddae5; color: #4a6579; }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 30px; font-size: 0.78rem; font-weight: 600; }
        .tag-excellent { background: #0b2b44; color: white; }
        .tag-pass { background: #dff0e3; color: #1d6f3a; }
        .tag-warning { background: #fff0d6; color: #a86d0e; }
        .tag-fail { background: #fce1e1; color: #a82e2e; }
        .tag-untracked { background: #f0f4f8; color: #6e8da3; }
        .mini-ontime { background: #dff0e3; color: #1d6f3a; }
        .mini-late { background: #fff0d6; color: #a86d0e; }
        .mini-early { background: #ffe4df; color: #b3452c; }
        .mini-leave { background: #e1e9f7; color: #315f9e; }
        .mini-absent { background: #fce1e1; color: #a82e2e; }
    </style>
</head>
<body>

<!-- 載入中遮罩 -->
<div class="loading-overlay" id="loadingOverlay">☁️ 正在同步雲端數據，請稍候...</div>

<!-- ========== 登入介面 ========== -->
<div class="login-wrapper" id="loginWrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="logo">🏫</div>
            <h1>粵華中學學生會</h1>
            <p>出勤考察系統</p>
        </div>
        <div class="login-body">
            <div class="form-group">
                <label>👤 帳戶</label>
                <input type="text" id="loginAccount" placeholder="請輸入帳戶名" autocomplete="off">
            </div>
            <div class="form-group">
                <label>🔒 密碼</label>
                <input type="password" id="loginPassword" placeholder="請輸入密碼">
            </div>
            <button class="login-btn" id="loginBtn">登 入</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>
</div>

<!-- ========== 主應用 ========== -->
<div class="app-container" id="appContainer">
    <div class="header">
        <h1>
            <div class="header-logo">📋</div>
            粵華中學 · 學生會出勤考察系統
            <span>雲端版</span>
        </h1>
        <div class="header-right">
            <div class="user-badge" id="userBadge">👤 未登入</div>
            <button class="logout-btn" id="logoutBtn">登出</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="dashboard">📊 總覽</button>
        <button class="nav-tab" data-tab="attendance">📝 考勤記錄</button>
        <button class="nav-tab" data-tab="members">👥 成員管理</button>
        <button class="nav-tab" data-tab="stats">📈 統計分析</button>
    </div>

    <div class="main-content">
        <!-- 總覽面板 -->
        <div id="dashboard" class="tab-pane active">
            <div class="filter-bar" style="background:#f8fbfe; padding:16px; border-radius:20px; border:1px solid #d9e4ee;">
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <label style="font-size:0.78rem; font-weight:600; color:#4a6579;">📌 活動類型</label>
                    <select id="overviewSceneFilter">
                        <option value="all">全部活動類型</option>
                        <option value="內閣例會">內閣例會</option>
                        <option value="學生會室當值">學生會室當值</option>
                        <option value="大型活動">大型活動</option>
                        <option value="培訓">培訓</option>
                    </select>
                </div>
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <label style="font-size:0.78rem; font-weight:600; color:#4a6579;">📅 日期</label>
                    <input type="date" id="overviewDateFilter">
                </div>
                <button class="btn btn-ghost btn-sm" id="clearOverviewFilterBtn" style="align-self:flex-end;">清除篩選</button>
            </div>

            <div id="overviewResultInfo" style="font-size:0.85rem; color:#6e8da3; margin-bottom:12px;"></div>
            <div class="stats-grid" id="dashboardStats"></div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px;">
                <h3 id="warningTableTitle" style="color: #0b2b44; font-size: 1.2rem;">⚠️ 近期預警成員</h3>
                <button class="btn btn-sm btn-ghost" id="refreshWarningsBtn">刷新</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead id="warningTableHead">
                        <!-- 動態生成表頭 -->
                    </thead>
                    <tbody id="warningTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 考勤記錄 -->
        <div id="attendance" class="tab-pane">
            <div class="session-panel">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3 style="font-size: 1.15rem; color: #1c4a7a;">📌 是次考察場次設定</h3>
                    <div id="sessionBadge" style="background:white; border:1px solid #b6cfe6; border-radius:30px; padding:6px 16px; font-size:0.85rem; font-weight:600; color:#1c4a7a;">尚未設定場次</div>
                </div>
                <div id="sessionStatusHint" style="font-size: 0.85rem; color: #a86d0e; background: #fff6e0; padding: 8px 16px; border-radius: 14px; margin-bottom: 14px;">
                    ⚠️ 請先設定活動類型、活動項目與日期，然後勾選下方成員卡片登記考察狀態
                </div>
                <div class="session-body">
                    <div class="field">
                        <label>活動類型</label>
                        <select id="sessionSceneSelect">
                            <option value="內閣例會">內閣例會</option>
                            <option value="學生會室當值">學生會室當值</option>
                            <option value="大型活動">大型活動</option>
                            <option value="培訓">培訓</option>
                        </select>
                    </div>
                    <div class="field" style="flex: 1.5;">
                        <label>活動項目</label>
                        <select id="sessionEventSelect">
                            <option value="無">無</option>
                            <option value="明愛慈善園遊會BINGO">明愛慈善園遊會BINGO</option>
                            <option value="歌唱比賽">歌唱比賽</option>
                            <option value="友校交流">友校交流</option>
                            <option value="學社推廣日">學社推廣日</option>
                            <option value="粵華論壇">粵華論壇</option>
                            <option value="學生會換屆選舉">學生會換屆選舉</option>
                            <option value="新生遊校園">新生遊校園</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>日期</label>
                        <input type="date" id="sessionDateInput">
                    </div>
                    <button class="btn btn-primary btn-sm" id="applySessionBtn" style="height:40px;">✅ 設定場次</button>
                </div>
            </div>

            <div class="record-panel" id="recordPanel">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
                    <h3 style="font-size: 1.15rem; color: #8a5a00;">📝 為已選成員批次登記考察狀態</h3>
                    <div id="selectedMembersSummary" style="background:white; padding:6px 16px; border-radius:40px; border:1px solid #f5d9a8; font-size:0.9rem; font-weight:600; color:#0b2b44;">
                        尚未選擇成員
                    </div>
                </div>
                <div style="font-size:0.85rem; color:#a86d0e; background:#fff6e0; padding:8px 16px; border-radius:14px; margin-bottom:14px;">
                    💡 此狀態將同時套用於所有已選成員及上方設定的場次，請選擇狀態後按「儲存記錄」
                </div>
                <div class="record-panel-body">
                    <div class="field" style="flex:2; min-width:200px;">
                        <label>考察狀態</label>
                        <div class="status-quick-btns" id="statusQuickBtns">
                            <button type="button" class="status-quick-btn" data-status="準時">準時</button>
                            <button type="button" class="status-quick-btn" data-status="遲到">遲到</button>
                            <button type="button" class="status-quick-btn" data-status="早退">早退</button>
                            <button type="button" class="status-quick-btn" data-status="請假">請假</button>
                            <button type="button" class="status-quick-btn" data-status="缺席">缺席</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>備註（可選）</label>
                        <input type="text" id="recordNoteInput" placeholder="如：全體遲到10分鐘" style="padding:10px 14px; border-radius:14px; border:1px solid #f0d5a8;">
                    </div>
                    <div style="display:flex; gap:10px; margin-left:auto;">
                        <button class="btn btn-ghost btn-sm" id="cancelRecordPanelBtn">取消</button>
                        <button class="btn btn-primary btn-sm" id="saveRecordPanelBtn" disabled>💾 儲存記錄</button>
                    </div>
                </div>
            </div>

            <div class="filter-bar">
                <select id="attendanceFilterMember">
                    <option value="all">全部成員</option>
                </select>
                <select id="attendanceFilterStatus">
                    <option value="all">全部狀態</option>
                    <option value="準時">準時</option>
                    <option value="遲到">遲到</option>
                    <option value="早退">早退</option>
                    <option value="請假">請假</option>
                    <option value="缺席">缺席</option>
                </select>
                <div style="margin-left: auto; display:flex; gap:8px;">
                    <button class="btn btn-ghost btn-sm" id="selectAllBtn">全選當前成員</button>
                    <button class="btn btn-ghost btn-sm" id="clearSelectionBtn">清除選擇</button>
                </div>
            </div>
            <div id="attendanceCardsContainer"></div>
        </div>

        <!-- 成員管理 -->
        <div id="members" class="tab-pane">
            <div class="filter-bar">
                <input type="text" id="memberSearchInput" placeholder="搜尋姓名 / 部門...">
                <button class="btn btn-primary btn-sm" id="openAddMemberBtn">➕ 新增成員</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>照片</th><th>姓名</th><th>班級</th><th>部門</th><th>職務</th><th>入會時間</th><th>出勤率</th><th>操作</th></tr>
                    </thead>
                    <tbody id="memberTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 統計分析 -->
        <div id="stats" class="tab-pane">
            <div class="stats-grid" id="statsSummaryGrid" style="margin-bottom: 28px;"></div>
            <h3 style="color: #0b2b44; margin: 10px 0 16px; font-size: 1.2rem;">📌 部門出勤率排名</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>排名</th><th>部門</th><th>成員數</th><th>出勤率</th><th>無故缺席次數</th><th>考核等級</th></tr>
                    </thead>
                    <tbody id="deptRankTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 新增成員模態框 -->
<div class="modal-overlay" id="addMemberModal">
    <div class="modal">
        <h2>👤 新增學生會成員</h2>
        <div class="form-row">
            <label>成員照片</label>
            <div id="memberPhotoUploadArea" style="display:flex; flex-direction:column; align-items:center; gap:12px; padding:20px; background:#f8fbfe; border-radius:24px; border:2px dashed #cddae5; cursor:pointer;">
                <div id="memberPhotoPreviewContainer">

<!-- ================= 引入 Firebase SDK ================= -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==================== 1. 填寫您的 Firebase 設定 ====================
    // ⚠️ 請將以下內容替換為您在 Firebase 控制台取得的真實設定 ⚠️
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 集合名稱
    const MEMBERS_COLLECTION = "members";
    const RECORDS_COLLECTION = "attendance_records";

    // ==================== 2. 系統變數與狀態 ====================
    let members = [];
    let attendanceRecords = [];
    let currentUser = null;
    let pendingMemberPhoto = '';
    let selectedMemberIds = new Set();
    let panelSelectedStatus = null;
    let pendingDeleteMemberId = null;
    let currentSession = { scene: null, event: null, date: null, applied: false };

    // 更新後的帳戶與密碼
    const ACCOUNTS = [
        { account: 'ywcsu', password: 'su315484', displayName: '學生會管理員', role: 'admin' }
    ];

    // ==================== 3. 雲端資料庫連線與監聽 ====================
    const loadingOverlay = document.getElementById('loadingOverlay');
    
    function initCloudSync() {
        loadingOverlay.classList.add('show');
        
        // 監聽成員資料
        onSnapshot(collection(db, MEMBERS_COLLECTION), (snapshot) => {
            members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (currentUser) refreshAll();
        });

        // 監聽考勤記錄
        onSnapshot(collection(db, RECORDS_COLLECTION), (snapshot) => {
            attendanceRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (currentUser) refreshAll();
            loadingOverlay.classList.remove('show');
        });
    }

    initCloudSync();

    // ==================== 4. 資料庫寫入/刪除操作 ====================
    async function addMemberToDB(memberData) {
        const newDocRef = doc(collection(db, MEMBERS_COLLECTION));
        await setDoc(newDocRef, { ...memberData, id: newDocRef.id });
    }

    async function deleteMemberFromDB(memberId) {
        await deleteDoc(doc(db, MEMBERS_COLLECTION, memberId));
        const batch = writeBatch(db);
        attendanceRecords.filter(r => r.memberId === memberId).forEach(record => {
            batch.delete(doc(db, RECORDS_COLLECTION, record.id));
        });
        await batch.commit();
    }

    async function addAttendanceRecordsToDB(recordsArray) {
        const batch = writeBatch(db);
        recordsArray.forEach(record => {
            const newDocRef = doc(collection(db, RECORDS_COLLECTION));
            batch.set(newDocRef, { ...record, id: newDocRef.id });
        });
        await batch.commit();
    }

    // ==================== 5. 系統邏輯與渲染 ====================
    function getMemberById(id) { return members.find(m => m.id === id); }

    function getMemberStats(memberId, records = attendanceRecords) {
        const memberRecords = records.filter(r => r.memberId === memberId);
        const total = memberRecords.length;
        if (total === 0) return { total: 0, onTime: 0, late: 0, early: 0, leave: 0, absent: 0, attendanceRate: 100, absentCount: 0, grade: '優秀' };
        
        const onTime = memberRecords.filter(r => r.status === '準時').length;
        const late = memberRecords.filter(r => r.status === '遲到').length;
        const early = memberRecords.filter(r => r.status === '早退').length;
        const leave = memberRecords.filter(r => r.status === '請假').length;
        const absent = memberRecords.filter(r => r.status === '缺席').length;
        const expected = total - leave;
        let rate = expected > 0 ? ((onTime + late + early) / expected) * 100 : 100;
        rate = Math.min(100, Math.round(rate * 100) / 100);
        
        let grade = '合格';
        if (rate >= 95 && absent === 0) grade = '優秀';
        else if (rate >= 80) grade = '合格';
        else if (rate >= 60) grade = '預警';
        else grade = '不合格';
        
        return { total, onTime, late, early, leave, absent, attendanceRate: rate, absentCount: absent, grade };
    }

    function getDeptStats() {
        const deptMap = {};
        members.forEach(m => {
            if (!deptMap[m.dept]) deptMap[m.dept] = { members: [], dept: m.dept };
            deptMap[m.dept].members.push(m);
        });
        return Object.values(deptMap).map(d => {
            let totalRate = 0, totalAbsent = 0, count = 0;
            d.members.forEach(m => {
                const stats = getMemberStats(m.id);
                totalRate += stats.attendanceRate;
                totalAbsent += stats.absentCount;
                count++;
            });
            const avgRate = count > 0 ? Math.round((totalRate / count) * 100) / 100 : 100;
            let grade = '合格';
            if (avgRate >= 95 && totalAbsent === 0) grade = '優秀';
            else if (avgRate >= 80) grade = '合格';
            else if (avgRate >= 60) grade = '預警';
            else grade = '不合格';
            return { dept: d.dept, memberCount: d.members.length, avgRate, totalAbsent, grade };
        }).sort((a, b) => b.avgRate - a.avgRate);
    }

    function avatarHtml(member, size = '') {
        if (member.photo) return `<img src="${member.photo}" class="avatar" style="object-fit:cover;">`;
        const initial = member.name.charAt(0).toUpperCase();
        return `<div class="avatar avatar-placeholder">${initial}</div>`;
    }

    function cardAvatarHtml(member) {
        if (member.photo) return `<img src="${member.photo}" class="card-avatar" style="object-fit:cover;">`;
        const initial = member.name.charAt(0).toUpperCase();
        return `<div class="card-avatar avatar-placeholder">${initial}</div>`;
    }

    let toastTimeout = null;
    function showToast(msg) {
        const toast = document.getElementById('toastMessage');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function renderDashboard() {
        const sceneFilter = document.getElementById('overviewSceneFilter').value;
        const dateFilter = document.getElementById('overviewDateFilter').value;
        
        const filteredRecords = attendanceRecords.filter(r => {
            if (sceneFilter !== 'all' && r.scene !== sceneFilter) return false;
            if (dateFilter && r.date !== dateFilter) return false;
            return true;
        });

        const infoDiv = document.getElementById('overviewResultInfo');
        if (sceneFilter !== 'all' || dateFilter) {
            infoDiv.innerHTML = `🔍 篩選條件：${sceneFilter !== 'all' ? sceneFilter : '全部活動'} · ${dateFilter || '不限日期'} · 符合記錄 <strong>${filteredRecords.length}</strong> 條`;
        } else {
            infoDiv.innerHTML = `🔍 目前顯示：<strong>全部活動及日期</strong> · 總記錄 <strong>${filteredRecords.length}</strong> 條`;
        }

        const statsGrid = document.getElementById('dashboardStats');
        let totalExpected = 0, totalPresent = 0;
        members.forEach(m => {
            const mRecs = filteredRecords.filter(r => r.memberId === m.id);
            const expected = mRecs.length - mRecs.filter(r => r.status === '請假').length;
            const present = mRecs.filter(r => ['準時','遲到','早退'].includes(r.status)).length;
            totalExpected += expected; totalPresent += present;
        });
        const overallRate = totalExpected > 0 ? Math.round((totalPresent / totalExpected) * 10000) / 100 : 100;
        
        const rateLabel = sceneFilter === '內閣例會' ? '核心內閣出勤率' : '整體出勤率';

        statsGrid.innerHTML = `
            <div class="stat-card"><div class="label">學生會成員</div><div class="value">${members.length}</div><div class="sub">在任成員總數</div></div>
            <div class="stat-card"><div class="label">考勤記錄</div><div class="value">${filteredRecords.length}</div><div class="sub">符合篩選條件</div></div>
            <div class="stat-card"><div class="label">${rateLabel}</div><div class="value">${overallRate}%</div><div class="sub">基於篩選記錄</div></div>
            <div class="stat-card"><div class="label">無故缺席</div><div class="value" style="color:#b3452c;">${filteredRecords.filter(r => r.status === '缺席').length}</div><div class="sub">符合篩選次數</div></div>
        `;

        const tbody = document.getElementById('warningTableBody');
        const thead = document.getElementById('warningTableHead');
        const title = document.getElementById('warningTableTitle');

        if (sceneFilter === '內閣例會') {
            // 顯示核心內閣出席狀況列表
            title.textContent = '👥 核心內閣出席狀況列表';
            thead.innerHTML = `
                <tr><th>姓名</th><th>職務</th><th>出席狀態</th><th>備註</th></tr>
            `;
            
            const cabinetMembers = members.filter(m => m.dept === '核心內閣');
            if (cabinetMembers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">暫無核心內閣成員</td></tr>`;
            } else {
                tbody.innerHTML = cabinetMembers.map(m => {
                    const record = filteredRecords.find(r => r.memberId === m.id);
                    let statusHtml = `<span class="tag tag-untracked">未登記</span>`;
                    let noteText = '-';
                    if (record) {
                        const cls = record.status === '準時' ? 'tag-pass' : 
                                    (record.status === '遲到' ? 'tag-warning' : 
                                    (record.status === '早退' ? 'tag-fail' : 
                                    (record.status === '請假' ? 'tag-untracked' : 'tag-fail')));
                        statusHtml = `<span class="tag ${cls}">${record.status}</span>`;
                        noteText = record.note || '-';
                    }
                    return `<tr>
                        <td><div style="display:flex; align-items:center; gap:10px;">${avatarHtml(m)}<strong>${m.name}</strong></div></td>
                        <td>${m.role}</td>
                        <td>${statusHtml}</td>
                        <td>${noteText}</td>
                    </tr>`;
                }).join('');
            }
        } else {
            // 顯示預警成員
            title.textContent = '⚠️ 近期預警成員';
            thead.innerHTML = `
                <tr><th>姓名</th><th>部門</th><th>出勤率</th><th>無故缺席</th><th>考核等級</th><th>狀態</th></tr>
            `;

            const warnings = members.map(m => ({ member: m, stats: getMemberStats(m.id, filteredRecords) }))
                .filter(item => item.stats.total > 0 && (item.stats.attendanceRate < 80 || item.stats.absentCount >= 1));
            
            tbody.innerHTML = warnings.length === 0 ? `<tr><td colspan="6" style="text-align:center;">✅ 所選條件下暫無預警成員</td></tr>` : 
                warnings.map(item => {
                    const m = item.member, s = item.stats;
                    const gradeClass = s.grade === '優秀' ? 'tag-excellent' : (s.grade === '合格' ? 'tag-pass' : (s.grade === '預警' ? 'tag-warning' : 'tag-fail'));
                    return `<tr>
                        <td><div style="display:flex; align-items:center; gap:10px;">${avatarHtml(m)}<strong>${m.name}</strong></div></td>
                        <td>${m.dept}</td>
                        <td>${s.attendanceRate}%</td>
                        <td style="color:${s.absentCount>0?'#b3452c':'inherit'}">${s.absentCount}</td>
                        <td><span class="tag ${gradeClass}">${s.grade}</span></td>
                        <td>${s.attendanceRate<60?'⚠️ 嚴重預警':(s.absentCount>=1?'⚠️ 需關注':'正常')}</td>
                    </tr>`;
                }).join('');
        }
    }

    function updateSessionUI() {
        const badge = document.getElementById('sessionBadge');
        const hint = document.getElementById('sessionStatusHint');
        if (currentSession.applied) {
            badge.innerHTML = `📌 場次：<strong>${currentSession.event}</strong> (${currentSession.scene} · ${currentSession.date})`;
            hint.style.background = '#dff0e3'; hint.style.color = '#1d6f3a';
            hint.innerHTML = `✅ 場次已設定！勾選下方成員卡片後可批次登記。`;
        } else {
            badge.textContent = '尚未設定場次';
            hint.style.background = '#fff6e0'; hint.style.color = '#a86d0e';
            hint.innerHTML = '⚠️ 請先設定活動類型、活動項目與日期，然後勾選下方成員卡片登記考察狀態';
        }
    }

    function updateSelectedSummary() {
        const summaryDiv = document.getElementById('selectedMembersSummary');
        const count = selectedMemberIds.size;
        if (count === 0) {
            summaryDiv.innerHTML = `<span style="color:#889fb0;">尚未選擇成員</span>`;
        } else {
            summaryDiv.innerHTML = `已選 <strong>${count}</strong> 人`;
        }
    }

    function updateSelectionButtons() {
        document.getElementById('saveRecordPanelBtn').disabled = !(selectedMemberIds.size > 0 && panelSelectedStatus);
        document.getElementById('recordPanel').classList.toggle('show', selectedMemberIds.size > 0);
    }

    function renderAttendanceCards() {
        const filterMember = document.getElementById('attendanceFilterMember').value;
        let displayMembers = members.filter(m => filterMember === 'all' || m.id === filterMember);

        if (displayMembers.length === 0) {
            document.getElementById('attendanceCardsContainer').innerHTML = `<div style="text-align:center; padding:40px;">暫無成員</div>`;
            return;
        }

        const container = document.getElementById('attendanceCardsContainer');
        container.innerHTML = `
            <div class="attendance-cards-grid">
                ${displayMembers.map(m => {
                    const mRecs = attendanceRecords.filter(r => r.memberId === m.id).sort((a,b) => (a.date < b.date ? 1 : -1));
                    const latest = mRecs[0];
                    const isSelected = selectedMemberIds.has(m.id);
                    let tag = '';
                    if (latest) {
                        const cls = latest.status === '準時' ? 'tag-pass' : (latest.status === '遲到' ? 'tag-warning' : 'tag-fail');
                        tag = `<span class="tag ${cls}">${latest.status}</span>`;
                    } else {
                        tag = `<span style="font-size:0.7rem; color:#b0c4d4;">暫無記錄</span>`;
                    }
                    return `
                        <div class="attendance-card ${isSelected ? 'selected-for-record' : ''}" onclick="toggleMemberSelection('${m.id}')">
                            <div class="card-checkbox"></div>
                            ${latest ? `<div style="position:absolute; top:12px; right:12px; font-size:0.65rem; color:#889fb0; background:white; padding:2px 8px; border-radius:20px; border:1px solid #e5edf4;">${latest.date}</div>` : ''}
                            ${cardAvatarHtml(m)}
                            <div class="card-name">${m.name}</div>
                            <div class="card-dept">${m.dept}</div>
                            <div style="margin-top:8px;">${tag}</div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    function renderMemberTable() {
        const search = document.getElementById('memberSearchInput').value.trim().toLowerCase();
        let filtered = members.filter(m => m.name.toLowerCase().includes(search) || m.dept.toLowerCase().includes(search));
        
        const tbody = document.getElementById('memberTableBody');
        tbody.innerHTML = filtered.map(m => {
            const s = getMemberStats(m.id);
            const gradeClass = s.grade === '優秀' ? 'tag-excellent' : (s.grade === '合格' ? 'tag-pass' : (s.grade === '預警' ? 'tag-warning' : 'tag-fail'));
            return `<tr>
                <td>${avatarHtml(m)}</td>
                <td><strong>${m.name}</strong></td>
                <td>${m.class}</td>
                <td>${m.dept}</td>
                <td>${m.role}</td>
                <td>${m.joinDate}</td>
                <td>${s.attendanceRate}% <span class="tag ${gradeClass}">${s.grade}</span></td>
                <td>
                    <button class="btn btn-sm btn-ghost" onclick="showMemberDetail('${m.id}')">詳情</button>
                    <button class="btn btn-sm btn-danger" onclick="confirmDeleteMember('${m.id}')" style="margin-left:6px;">刪除</button>
                </td>
            </tr>`;
        }).join('');
    }

    function renderStats() {
        const deptStats = getDeptStats();
        const summaryGrid = document.getElementById('statsSummaryGrid');
        const overallAvgRate = deptStats.reduce((acc, d) => acc + d.avgRate, 0) / (deptStats.length || 1);
        summaryGrid.innerHTML = `
            <div class="stat-card"><div class="label">部門數量</div><div class="value">${deptStats.length}</div><div class="sub">涵蓋所有部門</div></div>
            <div class="stat-card"><div class="label">平均出勤率</div><div class="value">${Math.round(overallAvgRate*100)/100}%</div><div class="sub">所有部門平均</div></div>
            <div class="stat-card"><div class="label">最高出勤部門</div><div class="value" style="font-size: 1.6rem;">${deptStats[0]?.dept || '—'}</div><div class="sub">出勤率 ${deptStats[0]?.avgRate || 0}%</div></div>
            <div class="stat-card"><div class="label">累計考勤記錄</div><div class="value">${attendanceRecords.length}</div><div class="sub">條</div></div>
        `;
        const tbody = document.getElementById('deptRankTableBody');
        tbody.innerHTML = deptStats.map((d, idx) => {
            const gradeClass = d.grade === '優秀' ? 'tag-excellent' : (d.grade === '合格' ? 'tag-pass' : (d.grade === '預警' ? 'tag-warning' : 'tag-fail'));
            return `<tr>
                <td><strong>#${idx+1}</strong></td>
                <td>${d.dept}</td>
                <td>${d.memberCount}</td>
                <td>${d.avgRate}%</td>
                <td>${d.totalAbsent}</td>
                <td><span class="tag ${gradeClass}">${d.grade}</span></td>
            </tr>`;
        }).join('');
    }

    function populateMemberFilter() {
        const select = document.getElementById('attendanceFilterMember');
        select.innerHTML = `<option value="all">全部成員</option>` + members.map(m => `<option value="${m.id}">${m.name} (${m.dept})</option>`).join('');
    }

    function refreshAll() {
        populateMemberFilter();
        updateSessionUI();
        updateSelectedSummary();
        updateSelectionButtons();
        renderDashboard();
        renderAttendanceCards();
        renderMemberTable();
        renderStats();
    }

    // ==================== 6. 事件綁定 ====================
    document.getElementById('applySessionBtn').addEventListener('click', () => {
        const scene = document.getElementById('sessionSceneSelect').value;
        const event = document.getElementById('sessionEventSelect').value;
        const date = document.getElementById('sessionDateInput').value;
        if (!date) return alert('請選擇日期');
        currentSession = { scene, event, date, applied: true };
        updateSessionUI();
        showToast(`✅ 已設定場次：${event}（${date}）`);
    });

    window.toggleMemberSelection = function(id) {
        if (!currentSession.applied) return showToast('⚠️ 請先設定場次');
        if (selectedMemberIds.has(id)) selectedMemberIds.delete(id);
        else selectedMemberIds.add(id);
        renderAttendanceCards();
        updateSelectedSummary();
        updateSelectionButtons();
    };

    document.getElementById('selectAllBtn').addEventListener('click', () => {
        if (!currentSession.applied) return showToast('⚠️ 請先設定場次');
        members.forEach(m => selectedMemberIds.add(m.id));
        renderAttendanceCards(); updateSelectedSummary(); updateSelectionButtons();
    });

    document.getElementById('clearSelectionBtn').addEventListener('click', () => {
        selectedMemberIds.clear();
        panelSelectedStatus = null;
        document.querySelectorAll('.status-quick-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('recordNoteInput').value = '';
        renderAttendanceCards(); updateSelectedSummary(); updateSelectionButtons();
    });

    document.querySelectorAll('.status-quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.status-quick-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            panelSelectedStatus = btn.dataset.status;
            updateSelectionButtons();
        });
    });

    document.getElementById('cancelRecordPanelBtn').addEventListener('click', () => {
        selectedMemberIds.clear();
        panelSelectedStatus = null;
        document.querySelectorAll('.status-quick-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('recordNoteInput').value = '';
        renderAttendanceCards(); updateSelectedSummary(); updateSelectionButtons();
    });

    document.getElementById('saveRecordPanelBtn').addEventListener('click', async () => {
        if (selectedMemberIds.size === 0 || !panelSelectedStatus) return;
        loadingOverlay.classList.add('show');
        const note = document.getElementById('recordNoteInput').value.trim();
        const recordsToAdd = Array.from(selectedMemberIds).map(id => ({
            memberId: id, 
            scene: currentSession.scene, 
            event: currentSession.event,
            status: panelSelectedStatus, 
            date: currentSession.date, 
            note
        }));
        await addAttendanceRecordsToDB(recordsToAdd);
        selectedMemberIds.clear();
        panelSelectedStatus = null;
        document.querySelectorAll('.status-quick-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('recordNoteInput').value = '';
        updateSelectedSummary();
        updateSelectionButtons();
        showToast(`✅ 已為 ${recordsToAdd.length} 位成員登記記錄`);
        loadingOverlay.classList.remove('show');
    });

    window.showMemberDetail = function(id) {
        const m = getMemberById(id); const s = getMemberStats(id);
        document.getElementById('memberDetailContent').innerHTML = `
            <div style="display:flex; gap:20px; align-items:center; margin-bottom:20px;">
                ${avatarHtml(m)} <h2>${m.name}</h2>
            </div>
            <p>班級：${m.class} | 部門：${m.dept} | 職務：${m.role}</p>
            <p style="margin-top:10px;">出勤率：${s.attendanceRate}% | 缺席：${s.absent} 次</p>
        `;
        document.getElementById('memberDetailModal').classList.add('show');
    };
    document.getElementById('closeMemberDetailBtn').addEventListener('click', () => document.getElementById('memberDetailModal').classList.remove('show'));

    window.confirmDeleteMember = function(id) {
        pendingDeleteMemberId = id;
        document.getElementById('deleteWarningContent').innerHTML = `確定要刪除該成員及其所有考勤記錄嗎？此操作無法復原。`;
        document.getElementById('deleteMemberModal').classList.add('show');
    };
    document.getElementById('cancelDeleteMemberBtn').addEventListener('click', () => document.getElementById('deleteMemberModal').classList.remove('show'));
    document.getElementById('confirmDeleteMemberBtn').addEventListener('click', async () => {
        if (!pendingDeleteMemberId) return;
        loadingOverlay.classList.add('show');
        await deleteMemberFromDB(pendingDeleteMemberId);
        pendingDeleteMemberId = null;
        document.getElementById('deleteMemberModal').classList.remove('show');
        showToast(`🗑️ 已刪除成員`);
        loadingOverlay.classList.remove('show');
    });

    // 新增成員與照片上傳
    document.getElementById('openAddMemberBtn').addEventListener('click', () => {
        document.getElementById('memberNameInput').value = '';
        document.getElementById('memberClassInput').value = '';
        document.getElementById('memberPhotoPreviewContainer').innerHTML = `<div style="width:96px; height:96px; border-radius:50%; background:#e2eaf1; display:flex; align-items:center; justify-content:center; font-size:2.4rem; color:#889fb0;">👤</div>`;
        pendingMemberPhoto = '';
        document.getElementById('addMemberModal').classList.add('show');
    });
    
    document.getElementById('cancelAddMemberBtn').addEventListener('click', () => document.getElementById('addMemberModal').classList.remove('show'));
    
    document.getElementById('saveMemberBtn').addEventListener('click', async () => {
        const name = document.getElementById('memberNameInput').value.trim();
        const cls = document.getElementById('memberClassInput').value.trim();
        if (!name || !cls) return alert('請填寫姓名和班級');
        loadingOverlay.classList.add('show');
        await addMemberToDB({
            name, class: cls,
            dept: document.getElementById('memberDeptSelect').value,
            role: document.getElementById('memberRoleSelect').value,
            joinDate: new Date().toISOString().split('T')[0],
            photo: pendingMemberPhoto
        });
        document.getElementById('addMemberModal').classList.remove('show');
        showToast(`✅ 已新增成員「${name}」`);
        loadingOverlay.classList.remove('show');
    });

    document.getElementById('memberPhotoUploadArea').addEventListener('click', () => document.getElementById('memberPhotoInput').click());
    document.getElementById('memberPhotoInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            pendingMemberPhoto = ev.target.result;
            document.getElementById('memberPhotoPreviewContainer').innerHTML = `<img src="${pendingMemberPhoto}" style="width:96px; height:96px; border-radius:50%; object-fit:cover;">`;
        };
        reader.readAsDataURL(file);
    });

    // 登入邏輯
    document.getElementById('loginBtn').addEventListener('click', () => {
        const acc = document.getElementById('loginAccount').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        const matched = ACCOUNTS.find(a => a.account === acc && a.password === pwd);
        if (!matched) {
            document.getElementById('loginError').textContent = '帳戶或密碼錯誤';
            return;
        }
        currentUser = matched;
        document.getElementById('loginWrapper').style.display = 'none';
        document.getElementById('appContainer').classList.add('show');
        document.getElementById('userBadge').textContent = `👤 ${matched.displayName}`;
        refreshAll();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        currentUser = null;
        document.getElementById('appContainer').classList.remove('show');
        document.getElementById('loginWrapper').style.display = 'block';
        document.getElementById('loginAccount').value = '';
        document.getElementById('loginPassword').value = '';
    });

    // 導航切換與其他監聽
    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });

    // 更新總覽篩選事件監聽
    ['overviewSceneFilter', 'overviewDateFilter'].forEach(id => {
        document.getElementById(id).addEventListener('change', renderDashboard);
    });
    document.getElementById('clearOverviewFilterBtn').addEventListener('click', () => {
        document.getElementById('overviewSceneFilter').value = 'all';
        document.getElementById('overviewDateFilter').value = '';
        renderDashboard();
    });

    document.getElementById('memberSearchInput').addEventListener('input', renderMemberTable);
    document.getElementById('attendanceFilterMember').addEventListener('change', renderAttendanceCards);
    document.getElementById('attendanceFilterStatus').addEventListener('change', renderAttendanceCards);

    // 預設日期
    document.getElementById('sessionDateInput').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
